# Standalone provider metadata inventory. Airflow runtime discovery is registered
# separately through pyproject.toml's apache_airflow_provider entry point.
package-name: apache-airflow-providers-huggingface
name: Hugging Face Datasets
description: Load, transform, and publish Hugging Face Datasets with Apache Airflow.
versions:
  - 0.1.0
integrations:
  - integration-name: Hugging Face Datasets
    external-doc-url: https://huggingface.co/docs/datasets/
hooks:
  - integration-name: Hugging Face Datasets
    python-modules:
      - airflow.providers.huggingface.hooks.datasets
operators:
  - integration-name: Hugging Face Datasets
    python-modules:
      - airflow.providers.huggingface.operators.datasets
connection-types:
  - connection-type: huggingface
    hook-class-name: airflow.providers.huggingface.hooks.datasets.HuggingFaceDatasetsHook
    hook-name: Hugging Face
