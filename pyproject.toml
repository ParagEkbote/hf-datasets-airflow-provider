[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "apache-airflow-providers-huggingface"
version = "0.1.0"
description = "Apache Airflow provider for Hugging Face Datasets"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
classifiers = [
  "Framework :: Apache Airflow",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "apache-airflow>=3.0,<4",
  "datasets>=3.4.0,<5",
  "huggingface-hub>=0.24,<2",
]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.huggingface.get_provider_info:get_provider_info"

[tool.flit.module]
name = "airflow.providers.huggingface"
directory = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
